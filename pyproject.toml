[project]
name = "relic-agent"
version = "0.1.0.dev0"
description = "A general-purpose agent organization runtime distilled from Relic B3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
relic-agent = "relic_agent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relic_agent"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "relic_agent/bundled_configs/default.yaml"
"configs/minimal.yaml" = "relic_agent/bundled_configs/minimal.yaml"
"examples/replay/trace.json" = "relic_agent/bundled_replay/trace.json"
"relic_agent/inspector/static/index.html" = "relic_agent/inspector/static/index.html"
"relic_agent/inspector/static/app.css" = "relic_agent/inspector/static/app.css"
"relic_agent/inspector/static/app.js" = "relic_agent/inspector/static/app.js"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: multi-component tests without paid model calls",
    "release: public release acceptance checks",
    "replay: trace and replay contract tests",
    "live: opt-in tests that may contact model providers",
    "docker: tests that require Docker",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

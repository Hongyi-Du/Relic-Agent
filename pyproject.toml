[project]
name = "relic-agent"
version = "0.1.0.dev0"
description = "Configurable agent organizations with Relic governance and learning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
relic-agent = "relic_agent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relic_agent", "organization_core", "agent_sdk", "environments"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "relic_agent/bundled_configs/default.yaml"
"configs/minimal.yaml" = "relic_agent/bundled_configs/minimal.yaml"
"configs/source-b3.yaml" = "relic_agent/bundled_configs/source-b3.yaml"
"examples/replay/trace.json" = "relic_agent/bundled_replay/trace.json"
"relic_agent/inspector/static/index.html" = "relic_agent/inspector/static/index.html"
"relic_agent/inspector/static/app.css" = "relic_agent/inspector/static/app.css"
"relic_agent/inspector/static/app.js" = "relic_agent/inspector/static/app.js"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: multi-component tests without paid model calls",
    "release: public release acceptance checks",
    "replay: trace and replay contract tests",
    "live: opt-in tests that may contact model providers",
    "docker: tests that require Docker",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The vendored source is blob-verified; retain its historical unused import.
"organization_core/evidence.py" = ["F401"]
# The source-exact HCI protocol object keeps this historical unused import.
"relic_agent/source_b3/protocols/objects.py" = ["F401"]
# The source-ported HCI episode manager retains this historical unused import.
"relic_agent/source_b3/episodes/episode_manager.py" = ["F401"]
# The source-pinned reflection manager and batch manager retain their source
# imports verbatim; local lint does not rewrite vendored behavior.
"relic_agent/source_b3/reflection/manager.py" = ["F401"]
"relic_agent/source_b3/reflection/batch_manager.py" = ["F401"]
# The growth closure is source-pinned apart from recorded import rewrites.
# Preserve upstream's historical unused names rather than changing its blob.
"relic_agent/source_b3/growth/objects.py" = ["F401"]
"relic_agent/source_b3/growth/appraiser.py" = ["F841"]
# The source-native B3 closure is blob-verified against its pinned upstream
# commit.  It is intentionally not reformatted/repaired by the release lint.
"agent_sdk/**/*.py" = ["E402", "E701", "E702", "E731", "E741", "F401", "F541", "F841"]
"environments/**/*.py" = ["E402", "E701", "E702", "E731", "E741", "F401", "F541", "F841"]
